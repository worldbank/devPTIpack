        var_description: |
          Total male population per H3-6 cell, WorldPop 2025 estimate.
        var_units: "count"
        pillar_group: ~
        pillar_name: "Demographics"
        legend_revert_colours: false
        time_col: ~
        available_years: ~
        weight: "none"
        fun: "sum"
        fltr_exclude_pti: false
      # --- §C Urbanization (GHS-SMOD via Space2Stats REST) ---
      # GHS-SMOD DEGURBA L2 codes: 30=Urban Centre, 23=Dense Town,
      # 22=Semi-dense Town, 21=Suburban/Peri-urban, 13=Rural Cluster,
      # 12=Low-density Rural, 11=Very Low-density Rural.
      # _count = number of H3-6 sub-cells in class; _pop = population.
      ghs_total_count:
        source_col: "ghs_total_count"
        var_name: "Total Urban Cells (GHS-SMOD)"
        var_description: |
          Total number of H3-6 sub-cells classified by GHS-SMOD degree
          of urbanisation (all classes combined).
        var_units: "cells"
        pillar_group: ~
        pillar_name: "Urbanization"
        legend_revert_colours: false
        time_col: ~
        available_years: ~
        weight: "none"
        fun: "sum"
        fltr_exclude_pti: true
      ghs_total_pop:
        source_col: "ghs_total_pop"
        var_name: "Total Population — GHS-SMOD (2020)"
        var_description: |
          Total population across all GHS-SMOD classes per H3-6 cell,
          sourced from the WB Space2Stats urbanization layer.
        var_units: "count"
        pillar_group: ~
