project:
  type: website
  output-dir: docs
  render:
    # 05-compile-report.qmd is rendered explicitly by 00-master.R into
    # app-data/pti-metadata.{html,pdf}; exclude it from the website
    # build. 00-master.R also copies the rendered report into docs/ so
    # the standalone GitHub Pages site can link to it (see the "Reports"
    # sidebar entry below).
    - "*.qmd"
    - "!05-compile-report.qmd"

website:
  title: "{{APP_NAME}}"
  navbar: false
  sidebar:
    style: "docked"
    search: false
    contents:
      - href: index.qmd
        text: "Overview"
      - section: "Data pipeline"
        contents:
          - href: 01-shapes.qmd
            text: "Step 1 — Shapefiles"
          - href: 02a-user-zonal-stats.qmd
            text: "Step 2 — Zonal stats (optional)"
          - href: 03-user-data.qmd
            text: "Step 3 — User data"
          - href: 04-hex-data.qmd
            text: "Step 4 — HEX data"
          - href: 05-compile.qmd
            text: "Step 5 — Compile"
      - section: "Reports"
        contents:
          # Copied into docs/ by 00-master.R after the website render,
          # so this link resolves when docs/ is deployed standalone.
          - href: pti-metadata.html
            text: "Metadata report"
      - section: "App"
        contents:
          - href: app-page.qmd
            text: "Live app"

format:
  html:
    theme: cosmo
    toc: true
