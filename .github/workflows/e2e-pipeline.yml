# Heavyweight end-to-end pipeline test (#163). Scaffolds a fresh PTI
# project with create_new_pti() and runs the full 00-master.R pipeline:
# real Quarto renders plus a live World Bank hex-data fetch. Far too
# slow (~5-10 min) for the per-PR `tests.yaml` budget, so it runs only
# on a weekly schedule, on pushes to `main`, and on manual dispatch.
#
# It sets PTI_RUN_E2E=true to un-gate tests/testthat/test-e2e-pipeline.R,
# which is skipped by every other workflow and by a plain
# `devtools::test()`.
on:
  push:
    branches: [main]
  schedule:
    # 04:17 UTC every Monday.
    - cron: '17 4 * * 1'
  workflow_dispatch:

name: e2e-pipeline

jobs:
  e2e-pipeline:
    runs-on: ubuntu-latest
    # The live WB hex fetch + Quarto renders dominate; give generous
    # headroom over the issue's 10-min Rwanda-run target.
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      PTI_RUN_E2E: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::testthat
            any::withr
            any::quarto
          needs: testing

      # The Quarto step renders spawn fresh R processes that
      # `library(devPTIpack)` -- the package must be installed in the
      # library, not merely load_all'd. The test-running session itself
      # uses devtools::test() (load_all) so the testthat helpers can see
      # the package's internal functions.
      - name: Install devPTIpack
        run: R CMD INSTALL --no-multiarch --with-keep.source .
        shell: bash

      - name: Run E2E pipeline test
        shell: Rscript {0}
        run: |
          options(testthat.progress.max_fails = Inf)
          res <- as.data.frame(
            devtools::test(filter = "e2e-pipeline", reporter = "summary")
          )
          cat(sprintf(
            "blocks: %d | passed: %d | failed: %d | errors: %d | skipped: %d\n",
            nrow(res), sum(res$nb), sum(res$failed),
            sum(res$error), sum(res$skipped)
          ))
          if (sum(res$failed) + sum(res$error) > 0) {
            stop("E2E pipeline test failed.")
          }
